sonar.projectKey=Japanese-IT-Pathway-Group-5_SNS
sonar.organization=japanese-it-pathway-group-5

# Source and test directories
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e.ts

# Exclusions
# Note: Per docs/PROJECT_PLAN.md, Svelte templates are excluded from deep Sonar analysis
# because svelte-check and eslint-plugin-svelte serve as the authoritative gate.
sonar.exclusions=**/*.svelte,worker-configuration.d.ts,static/**,drizzle/**,node_modules/**,.svelte-kit/**

sonar.cpd.exclusions=src/**/*.test.ts,src/**/*.spec.ts,src/**/*.e2e.ts

sonar.sourceEncoding=UTF-8
