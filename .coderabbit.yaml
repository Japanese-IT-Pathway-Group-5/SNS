# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

tone_instructions: >
  Be concise and actionable. Focus on code correctness, security,
  and architectural alignment. Respect Svelte 5, strict TypeScript,
  Cloudflare Workers, D1/R2, and project rules in AGENTS.md.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

path_filters:
  - '!node_modules/**'
  - '!.svelte-kit/**'
  - '!worker-configuration.d.ts'
  - '!pnpm-lock.yaml'
  - '!drizzle/**'
