# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'en-US'
tone_instructions: >
  Be concise, actionable, and focus on code correctness, security, and architectural alignment.
  Respect Svelte 5 runes, strict TypeScript, Cloudflare Workers D1/R2 constraints, and project rules in AGENTS.md.
  Check that server authorization verifies membership and ownership in domain operations, not just layouts.

reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - 'main'
  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true

path_filters:
  - '!node_modules/**'
  - '!.svelte-kit/**'
  - '!worker-configuration.d.ts'
  - '!pnpm-lock.yaml'
  - '!drizzle/**'

chat:
  auto_reply: true

knowledge_base:
  learnings:
    enabled: true
  issues:
    enabled: true
